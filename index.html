<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--panel:#0a0a0c;--border:rgba(255,255,255,.08);--surface:rgba(255,255,255,.06);--accent:#6366f1;--accent-2:#8b5cf6;--green:#10b981}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
.app{height:100dvh;display:flex;align-items:center;justify-content:center}
.phone-frame{position:relative;background:#000;display:flex;flex-direction:column;overflow:hidden}

.badge.live{background:rgba(239,68,68,.85)}.badge.upload{background:rgba(99,102,241,.85)}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.55);font-size:12px;text-align:center;z-index:5;pointer-events:none}
.placeholder.hidden{opacity:0;visibility:hidden}
.divider{flex:0 0 2px;background:rgba(255,255,255,.4);z-index:20;cursor:ns-resize;touch-action:none;position:relative}
.divider::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
.divider.vert{cursor:ew-resize}
.rec-badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(239,68,68,.95);font-size:12px;font-weight:800;display:flex;gap:7px;z-index:30;opacity:0;pointer-events:none}
.rec-badge.show{opacity:1}
.control-panel{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:25;overflow-y:auto;max-height:55vh}

.circle-btn.primary{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}

.pill:disabled{opacity:.35;pointer-events:none}

.expand-panel{display:none;padding-top:2px}.expand-panel.open{display:block}
.ticker-input{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:#fff;font-size:11px;outline:none}
.ticker-overlay{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);overflow:hidden;z-index:15;display:none;pointer-events:none}
.ticker-overlay.show{display:block}.ticker-track{position:absolute;inset:0;overflow:hidden}
.ticker-item{position:absolute;left:0;top:50%;white-space:nowrap;font-weight:800;color:#fff;will-change:transform}
.record-btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#ff3366,#e60045);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.record-btn.recording{background:#1a1a1e}
input[type=file]{display:none}

.modal-header button{background:var(--surface);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.modal-body video{width:100%;border-radius:14px;background:#000}
.modal-actions{display:flex;flex-direction:column;gap:8px}
.modal-btn{padding:14px;border-radius:14px;border:none;font-weight:700;color:#fff;cursor:pointer}
.modal-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2))}.modal-btn.secondary{background:var(--surface);border:1px solid var(--border)}
.bg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bg-option{aspect-ratio:16/10;border-radius:12px;border:2px solid rgba(255,255,255,.12);background:#1a1a1e;color:#fff;font-size:11px;font-weight:800;cursor:pointer}
.bg-option.active{border-color:#a78bfa}
.bg-upload-label{padding:14px;border-radius:14px;background:var(--surface);border:1px dashed rgba(255,255,255,.25);cursor:pointer;text-align:center;font-size:13px;font-weight:700}
.toast{position:fixed;bottom:240px;left:50%;transform:translateX(-50%);background:rgba(30,30,35,.98);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:85%;text-align:center}
.toast.show{opacity:1}.toast.error{background:rgba(239,68,68,.95)}.toast.success{background:rgba(16,185,129,.95)}

.loader.show{display:flex}.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.screen-live.floating{position:absolute!important;flex:none!important;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.75),0 0 0 2px rgba(255,255,255,.25);z-index:40;cursor:grab}

.video-progress-fill{height:100%;width:0%;background:var(--accent)}

<body>
<div class="app"><div class="phone-frame mode-9-16" id="phoneFrame">
<div class="video-area" id="videoArea">

</div>

<div class="control-panel">

<div class="ctrl-row"><button class="pill" id="btnStartCam">📹 Kamera</button><button class="pill" id="btnScreen">🖥️ Layar</button><button class="pill" id="btnMic">🎤 Mic</button><button class="pill" id="btnBg">🎨 BG</button><button class="pill" id="btnUpload">⬆️ Upload</button><button class="pill" id="btnQuality"><span id="qualityLabel">HEMAT</span></button></div>
<div class="ctrl-row"><button class="expand-btn" data-expand="split">📐 Split</button><button class="expand-btn" data-expand="aspect">📱 Rasio</button><button class="expand-btn" data-expand="float">📌 Float</button><button class="expand-btn" data-expand="ticker">📝 Teks</button><button class="expand-btn" id="btnSwapScreens">⇅</button></div>

<div class="expand-panel" data-panel-for="ticker"><div class="ctrl-row"><input id="tickerInput" class="ticker-input" placeholder="Teks berjalan..." maxlength="200"><button class="pill" id="tickerToggle">▶</button></div></div>
<div style="background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.4">⚡ <b>MODE SUPER HEMAT AKTIF:</b> BG 240px • Segmentasi 2x/detik • Rekam 540p 24fps • Blur dimatikan biar tidak leg</div>
<button class="record-btn" id="btnRecord"><span>●</span><span class="rec-text">Mulai Rekam</span></button>
</div>
<div class="loader" id="loader"><div class="spinner"></div><span id="loaderText">Memproses...</span></div>
</div></div>
<input type="file" id="fileInput" accept="video/*" />
<div class="modal" id="bgModal"><div class="modal-card"><div class="modal-header"><span>🎨 Ganti Background - Hemat</span><button id="btnCloseBgModal">✕</button></div><div class="modal-body"><div class="bg-grid"><button class="bg-option active" data-bg="off">🚫 Nonaktif</button><button class="bg-option" data-bg="gradient1" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">Gradient</button><button class="bg-option" data-bg="gradient2" style="background:linear-gradient(135deg,#f97316,#ec4899)">Sunset</button><button class="bg-option" data-bg="gradient3" style="background:linear-gradient(135deg,#10b981,#06b6d4)">Ocean</button><button class="bg-option" data-bg="gradient4" style="background:linear-gradient(135deg,#1f2937,#111827)">Dark</button><button class="bg-option" data-bg="image">🖼️ Gambar</button></div><label class="bg-upload-label"><input type="file" id="bgImageInput" accept="image/*" style="display:none">Upload Gambar Background</label><div style="font-size:12px;color:rgba(255,255,255,.55);text-align:center">Blur dihapus karena bikin leg. Pakai Gradient / Gambar saja.</div></div></div></div>
<div class="modal" id="previewModal"><div class="modal-card"><div class="modal-header"><span>✅ Hasil Rekaman</span><button id="btnClosePreview">✕</button></div><div class="modal-body"><video id="previewVideo" controls playsinline></video><div id="previewInfo" style="font-size:12px;color:rgba(255,255,255,.55);text-align:center"></div><div class="modal-actions"><button class="modal-btn primary" id="btnSaveGallery">Simpan / Bagikan</button><button class="modal-btn secondary" id="btnDownload">Unduh File</button></div></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<script>
/* ===== SUPER HEMAT - ANTI LEG ===== */
const BG_GRADIENTS={gradient1:['#6366f1','#8b5cf6'],gradient2:['#f97316','#ec4899'],gradient3:['#10b981','#06b6d4'],gradient4:['#1f2937','#111827']};
// KUNCI 1: Resolusi BG super kecil
const BG_W=240;
// KUNCI 2: Segmentasi cuma 2x per detik, BUKAN 30x
const SEG_INTERVAL=500;
// KUNCI 3: Rekam ringan
const REC_W=540, REC_FPS=24, REC_BITRATE=2500000;

const state={stream:null,facingMode:'user',micStream:null,micEnabled:false,uploadReady:false,isRecording:false,mediaRecorder:null,recordedChunks:[],recStartTime:0,timerInterval:null,aspectMode:'9:16',splitRatio:.4,swapped:false,bg:{mode:'off',image:null},ticker:{text:'',enabled:false},floating:{enabled:false,x:.62,y:.06,w:.32}};
const $=id=>document.getElementById(id);
const liveVideo=$('liveVideo'),uploadVideo=$('uploadVideo'),liveScreen=$('liveScreen'),uploadScreen=$('uploadScreen'),videoArea=$('videoArea'),phoneFrame=$('phoneFrame'),livePlaceholder=$('livePlaceholder'),uploadPlaceholder=$('uploadPlaceholder'),btnStartCam=$('btnStartCam'),btnScreen=$('btnScreen'),btnMic=$('btnMic'),btnBg=$('btnBg'),btnUpload=$('btnUpload'),btnRecord=$('btnRecord'),fileInput=$('fileInput'),recBadge=$('recBadge'),recTimerEl=$('recTimer'),loader=$('loader'),loaderText=$('loaderText'),toast=$('toast'),previewModal=$('previewModal'),previewVideo=$('previewVideo'),previewInfo=$('previewInfo'),btnClosePreview=$('btnClosePreview'),btnSaveGallery=$('btnSaveGallery'),btnDownload=$('btnDownload'),recText=btnRecord.querySelector('.rec-text'),divider=$('divider'),bgModal=$('bgModal'),btnCloseBgModal=$('btnCloseBgModal'),bgImageInput=$('bgImageInput'),liveBadge=$('liveBadge'),btnPlayPause=$('btnPlayPause'),btnBack=$('btnBack'),btnNext=$('btnNext'),btnStop=$('btnStop'),videoProgressFill=$('videoProgressFill'),tickerOverlay=$('tickerOverlay'),tickerTrack=$('tickerTrack'),tickerInput=$('tickerInput'),tickerToggle=$('tickerToggle'),btnSwapScreens=$('btnSwapScreens'),btnToggleFloat=$('btnToggleFloat');
function showToast(m,t=''){toast.textContent=m;toast.className='toast show '+t;clearTimeout(toast._t);toast._t=setTimeout(()=>toast.className='toast',2200)}
function showLoader(t){loaderText.textContent=t||'Memproses...';loader.classList.add('show')} function hideLoader(){loader.classList.remove('show')}

/* ===== BG SUPER HEMAT ===== */
const liveCanvas=$('liveCanvas'), liveCtx=liveCanvas.getContext('2d',{alpha:false,desynchronized:true});
let selfieSeg=null, segReady=false, segMask=null, lastSegTime=0, bgRAF=null, lastBgDraw=0;
let cachedBgCanvas=null, cachedBgKey='';
let workCanvas=document.createElement('canvas'), workCtx=workCanvas.getContext('2d',{willReadFrequently:false});

function getCachedBg(w,h){
  const key=state.bg.mode+'_'+w+'x'+h;
  if(cachedBgCanvas && cachedBgKey===key) return cachedBgCanvas;
  cachedBgCanvas=document.createElement('canvas');cachedBgCanvas.width=w;cachedBgCanvas.height=h;
  const c=cachedBgCanvas.getContext('2d');
  if(state.bg.image){ c.drawImage(state.bg.image,0,0,w,h); }
  else if(BG_GRADIENTS[state.bg.mode]){ const [a,b]=BG_GRADIENTS[state.bg.mode]; const g=c.createLinearGradient(0,0,w,h); g.addColorStop(0,a); g.addColorStop(1,b); c.fillStyle=g; c.fillRect(0,0,w,h); }
  else { c.fillStyle='#000'; c.fillRect(0,0,w,h); }
  cachedBgKey=key; return cachedBgCanvas;
}
function initSeg(){
  if(selfieSeg) return;
  try{ selfieSeg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});
    selfieSeg.setOptions({modelSelection:0});
    selfieSeg.onResults(r=>{
      // Simpan mask di canvas 240px, JANGAN di resolusi full
      if(!segMask){ segMask=document.createElement('canvas'); }
      if(segMask.width!==BG_W){ segMask.width=BG_W; segMask.height=Math.round(BG_W*9/16); }
      segMask.getContext('2d').drawImage(r.segmentationMask,0,0,BG_W,segMask.height);
    });
    segReady=true;
  }catch(e){}
}
// LOOP BG: cuma gambar ulang 15fps, segmentasi 2x/detik
async function bgLoop(ts){
  bgRAF=requestAnimationFrame(bgLoop);
  if(state.bg.mode==='off'||!state.stream||!liveVideo.videoWidth){ liveCanvas.style.display='none'; return; }
  // Gambar ulang max 15fps
  if(ts-lastBgDraw<66) return;
  lastBgDraw=ts;
  const w=BG_W, h=Math.round(w*liveVideo.videoHeight/liveVideo.videoWidth);
  if(liveCanvas.width!==w){ liveCanvas.width=w; liveCanvas.height=h; }
  liveCanvas.style.display='block';
  liveCtx.imageSmoothingEnabled=true; liveCtx.imageSmoothingQuality='low';
  // 1. BG dari cache (0ms)
  liveCtx.drawImage(getCachedBg(w,h),0,0);
  // 2. Segmentasi JARANG - ini kunci anti leg
  if(segReady && selfieSeg && ts-lastSegTime>SEG_INTERVAL){
    lastSegTime=ts;
    // Jangan await blocking, fire & forget
    selfieSeg.send({image:liveVideo}).catch(()=>{});
  }
  // 3. Tempel orang pakai mask lama (kalau belum ada mask baru, pakai yang lama - tetap mulus)
  if(segMask){
    // Composite ringan: gambar video ke work canvas, potong pakai mask, tempel ke liveCanvas
    if(workCanvas.width!==w){ workCanvas.width=w; workCanvas.height=h; }
    workCtx.clearRect(0,0,w,h);
    workCtx.drawImage(segMask,0,0);
    workCtx.globalCompositeOperation='source-in';
    workCtx.drawImage(liveVideo,0,0,w,h);
    workCtx.globalCompositeOperation='source-over';
    liveCtx.drawImage(workCanvas,0,0);
  } else {
    liveCtx.drawImage(liveVideo,0,0,w,h);
  }
}
function setBgMode(mode){
  state.bg.mode=mode;
  cachedBgCanvas=null; cachedBgKey='';
  document.querySelectorAll('.bg-option').forEach(b=>b.classList.toggle('active',b.dataset.bg===mode));
  btnBg.classList.toggle('bg-active',mode!=='off');
  if(mode!=='off'){ initSeg(); if(!bgRAF) bgRAF=requestAnimationFrame(bgLoop); showToast('BG aktif - mode hemat','success'); }
  else { liveCanvas.style.display='none'; showToast('BG off'); }
  bgModal.classList.remove('show');
}

/* ===== ASPECT / SPLIT / SWAP / FLOAT ===== */
function isLand(){ if(state.aspectMode==='16:9') return true; if(state.aspectMode==='9:16') return false; return videoArea.clientWidth>videoArea.clientHeight; }
function updateDivider(){ divider.classList.toggle('vert',isLand()); videoArea.style.flexDirection=isLand()?'row':'column'; }
function setAspect(m){ if(state.isRecording){showToast('Stop rekaman dulu','error');return} state.aspectMode=m; phoneFrame.classList.remove('mode-9-16','mode-16-9','mode-asli'); phoneFrame.classList.add('mode-'+m.replace(':','-')); document.querySelectorAll('[data-aspect]').forEach(b=>b.classList.toggle('active',b.dataset.aspect===m)); requestAnimationFrame(()=>{updateDivider();updateTickerDOM(); if(state.floating.enabled) updateFloat()}); showToast('Rasio: '+m); }
document.querySelectorAll('[data-aspect]').forEach(b=>b.onclick=()=>{setAspect(b.dataset.aspect);closeAll()});
function closeAll(){ document.querySelectorAll('.expand-panel').forEach(p=>p.classList.remove('open')); document.querySelectorAll('.expand-btn').forEach(b=>b.classList.remove('open')); }
document.querySelectorAll('.expand-btn').forEach(btn=>{ if(!btn.dataset.expand) return; btn.onclick=()=>{ const p=document.querySelector(`.expand-panel[data-panel-for="${btn.dataset.expand}"]`); const was=p.classList.contains('open'); closeAll(); if(!was){p.classList.add('open'); btn.classList.add('open');} }});
function applySplit(){ const r=state.splitRatio; const f=state.swapped?uploadScreen:liveScreen, s=state.swapped?liveScreen:uploadScreen; f.style.flex=`${r} 1 0`; s.style.flex=`${1-r} 1 0`; }
document.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{ state.splitRatio=parseFloat(b.dataset.split); document.querySelectorAll('[data-split]').forEach(x=>x.classList.toggle('active',x===b)); applySplit(); closeAll(); });
function swap(){ if(state.isRecording){showToast('Stop rekaman dulu','error');return} if(state.floating.enabled){showToast('Matikan float dulu','error');return} state.swapped=!state.swapped; const f=state.swapped?uploadScreen:liveScreen, s=state.swapped?liveScreen:uploadScreen; f.style.order='1'; divider.style.order='2'; s.style.order='3'; applySplit(); showToast(state.swapped?'UPLOAD di atas':'LIVE di atas','success'); }
btnSwapScreens.onclick=swap;
function toggleFloat(force){ if(state.isRecording){showToast('Stop rekaman dulu','error');return} const n=typeof force==='boolean'?force:!state.floating.enabled; state.floating.enabled=n; if(n && state.swapped){state.swapped=false; liveScreen.style.order=''; uploadScreen.style.order='';} applyFloat(); btnToggleFloat.textContent=n?'Kembalikan ke Split':'Aktifkan Float'; showToast(n?'Float ON - geser bebas':'Float OFF','success'); }
function applyFloat(){ if(!state.floating.enabled){ liveScreen.classList.remove('floating'); liveScreen.style.cssText=''; divider.style.display=''; applySplit(); return; } liveScreen.classList.add('floating'); divider.style.display='none'; uploadScreen.style.flex='1 1 0'; updateFloat(); }
function updateFloat(){ const f=state.floating; if(!f.enabled) return; const aw=videoArea.clientWidth, ah=videoArea.clientHeight; let w=f.w*aw, h=w/(liveVideo.videoWidth/liveVideo.videoHeight||9/16); if(h>ah*.92){h=ah*.92; w=h*(liveVideo.videoWidth/liveVideo.videoHeight||9/16)} let x=Math.max(0,Math.min(aw-w,f.x*aw)), y=Math.max(0,Math.min(ah-h,f.y*ah)); liveScreen.style.left=x+'px'; liveScreen.style.top=y+'px'; liveScreen.style.width=w+'px'; liveScreen.style.height=h+'px'; }
btnToggleFloat.onclick=()=>toggleFloat();
document.querySelectorAll('[data-float-size]').forEach(b=>b.onclick=()=>{ state.floating.w=parseFloat(b.dataset.floatSize); if(state.floating.enabled) updateFloat(); });
document.querySelectorAll('[data-float-pos]').forEach(b=>b.onclick=()=>{ const p=b.dataset.floatPos; if(p==='tl'){state.floating.x=.04;state.floating.y=.04}else if(p==='tr'){state.floating.x=.62;state.floating.y=.04}else if(p==='center'){state.floating.x=.34;state.floating.y=.3}else if(p==='bl'){state.floating.x=.04;state.floating.y=.6}else if(p==='br'){state.floating.x=.62;state.floating.y=.6} if(state.floating.enabled) updateFloat(); });
let fDrag=null;
liveScreen.addEventListener('pointerdown',e=>{ if(!state.floating.enabled||state.isRecording) return; fDrag={sx:e.clientX,sy:e.clientY,ox:state.floating.x,oy:state.floating.y}; liveScreen.setPointerCapture(e.pointerId); });
liveScreen.addEventListener('pointermove',e=>{ if(!fDrag) return; state.floating.x=fDrag.ox+(e.clientX-fDrag.sx)/videoArea.clientWidth; state.floating.y=fDrag.oy+(e.clientY-fDrag.sy)/videoArea.clientHeight; updateFloat(); });
liveScreen.addEventListener('pointerup',()=>fDrag=null);
let dDrag=false;
divider.addEventListener('pointerdown',e=>{ if(state.floating.enabled) return; dDrag=true; divider.setPointerCapture(e.pointerId); });
divider.addEventListener('pointermove',e=>{ if(!dDrag) return; const r=videoArea.getBoundingClientRect(); const ratio=isLand()?(e.clientX-r.left)/r.width:(e.clientY-r.top)/r.height; state.splitRatio=Math.max(0,Math.min(1,ratio)); applySplit(); });
divider.addEventListener('pointerup',()=>dDrag=false);

/* ===== KAMERA / MIC / UPLOAD ===== */
async function startCam(){ try{ showLoader('Mengaktifkan kamera...'); if(state.stream) state.stream.getTracks().forEach(t=>t.stop()); state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facingMode,width:{ideal:640},height:{ideal:480}},audio:false}); liveVideo.srcObject=state.stream; await liveVideo.play(); livePlaceholder.classList.add('hidden'); liveBadge.style.display='block'; hideLoader(); showToast('Kamera aktif','success'); }catch(e){ hideLoader(); showToast('Gagal kamera: '+e.message,'error'); } }
async function toggleMic(){ try{ if(!state.micEnabled){ state.micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); state.micEnabled=true; btnMic.classList.add('active'); showToast('Mic ON','success'); } else { state.micStream.getTracks().forEach(t=>t.stop()); state.micStream=null; state.micEnabled=false; btnMic.classList.remove('active'); showToast('Mic OFF'); } }catch(e){ showToast('Gagal mic','error'); } }
btnStartCam.onclick=startCam; btnMic.onclick=toggleMic;
btnUpload.onclick=()=>fileInput.click();
fileInput.onchange=e=>{ const f=e.target.files[0]; if(!f) return; uploadVideo.src=URL.createObjectURL(f); uploadVideo.loop=true; uploadVideo.play(); uploadPlaceholder.classList.add('hidden'); state.uploadReady=true; showToast('Video terupload','success'); };
btnScreen.onclick=async()=>{ try{ const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}); uploadVideo.srcObject=s; await uploadVideo.play(); uploadPlaceholder.classList.add('hidden'); state.uploadReady=true; showToast('Layar aktif','success'); }catch(e){ showToast('Batal rekam layar','error'); } };
btnPlayPause.onclick=()=>{ if(uploadVideo.paused){uploadVideo.play(); btnPlayPause.textContent='⏸'} else {uploadVideo.pause(); btnPlayPause.textContent='▶'} };
btnBack.onclick=()=>uploadVideo.currentTime=Math.max(0,uploadVideo.currentTime-5);
btnNext.onclick=()=>uploadVideo.currentTime=Math.min(uploadVideo.duration||0,uploadVideo.currentTime+5);
btnStop.onclick=()=>{ uploadVideo.pause(); uploadVideo.currentTime=0; btnPlayPause.textContent='▶'; };
uploadVideo.addEventListener('timeupdate',()=>{ if(uploadVideo.duration) videoProgressFill.style.width=(uploadVideo.currentTime/uploadVideo.duration*100)+'%'; });
$('btnQuality').onclick=()=>showToast('Mode Hemat terkunci: 540p 24fps biar tidak leg','success');

/* ===== BG MODAL ===== */
btnBg.onclick=()=>bgModal.classList.add('show');
btnCloseBgModal.onclick=()=>bgModal.classList.remove('show');
bgModal.addEventListener('click',e=>{ if(e.target===bgModal) bgModal.classList.remove('show'); });
document.querySelectorAll('.bg-option').forEach(b=>b.onclick=()=>{
  if(b.dataset.bg==='image'){ bgImageInput.click(); return; }
  setBgMode(b.dataset.bg);
});
bgImageInput.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image(); img.onload=()=>{ state.bg.image=img; setBgMode('image'); }; img.src=URL.createObjectURL(f); };

/* ===== TICKER - RINGAN ===== */
let tickerRAF=null, tickerX=0;
function updateTickerDOM(){
  const h=state.ticker.enabled && state.ticker.text ? 32 : 0;
  tickerOverlay.style.height=h+'px'; tickerOverlay.classList.toggle('show',h>0);
  const el=tickerTrack.querySelector('.ticker-item'); el.textContent=state.ticker.text; el.style.fontSize='20px'; el.style.transform='translateY(-50%)';
  if(h>0){ cancelAnimationFrame(tickerRAF); tickerX=videoArea.clientWidth; let last=performance.now(); const loop=(now)=>{ const dt=(now-last)/1000; last=now; tickerX-=90*dt; if(tickerX< -300) tickerX=videoArea.clientWidth; el.style.transform=`translate(${tickerX}px,-50%)`; tickerRAF=requestAnimationFrame(loop); }; tickerRAF=requestAnimationFrame(loop); }
  else cancelAnimationFrame(tickerRAF);
}
tickerInput.oninput=()=>{ state.ticker.text=tickerInput.value; updateTickerDOM(); };
tickerToggle.onclick=()=>{ state.ticker.enabled=!state.ticker.enabled; if(state.ticker.enabled && !state.ticker.text) state.ticker.text=tickerInput.value||'Teks berjalan'; updateTickerDOM(); };

/* ===== REKAM SUPER HEMAT ===== */
let recCanvas=null, recCtx=null, recRAF=null, lastRecDraw=0;
function startTimer(){ state.recStartTime=Date.now(); recBadge.classList.add('show'); state.timerInterval=setInterval(()=>{ const s=Math.floor((Date.now()-state.recStartTime)/1000); recTimerEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); },500); }
function stopTimer(){ clearInterval(state.timerInterval); recBadge.classList.remove('show'); }
function drawComposite(ts){
  if(!state.isRecording) return;
  recRAF=requestAnimationFrame(drawComposite);
  // KUNCI: Rekam cuma 24fps, bukan 60fps
  if(ts-lastRecDraw<1000/REC_FPS) return;
  lastRecDraw=ts;
  const isL=isLand();
  const W=isL?REC_W:Math.round(REC_W*9/16), H=isL?Math.round(REC_W*9/16):REC_W;
  if(!recCanvas){ recCanvas=document.createElement('canvas'); recCtx=recCanvas.getContext('2d',{alpha:false,desynchronized:true}); }
  if(recCanvas.width!==W){ recCanvas.width=W; recCanvas.height=H; }
  const ctx=recCtx;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const drawOne=(vid,x,y,w,h)=>{
    if(!vid||!vid.videoWidth) return;
    let src=vid;
    if(vid===liveVideo && state.bg.mode!=='off' && liveCanvas.width>0) src=liveCanvas;
    const vw=src.videoWidth||src.width, vh=src.videoHeight||src.height;
    const sc=Math.max(w/vw,h/vh), dw=vw*sc, dh=vh*sc;
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    // imageSmoothing low = cepat
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='low';
    ctx.drawImage(src,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
    ctx.restore();
  };
  if(state.floating.enabled){
    drawOne(uploadVideo,0,0,W,H);
    const fw=W*state.floating.w, fh=fw/(liveVideo.videoWidth/liveVideo.videoHeight||9/16);
    drawOne(liveVideo,state.floating.x*W,state.floating.y*H,fw,fh);
  } else {
    const r=state.splitRatio;
    if(!isL){ const h1=H*r; if(!state.swapped){ drawOne(liveVideo,0,0,W,h1); drawOne(uploadVideo,0,h1,W,H-h1); } else { drawOne(uploadVideo,0,0,W,h1); drawOne(liveVideo,0,h1,W,H-h1); } ctx.fillStyle='rgba(255,255,255,.4)'; ctx.fillRect(0,h1-1,W,2); }
    else { const w1=W*r; if(!state.swapped){ drawOne(liveVideo,0,0,w1,H); drawOne(uploadVideo,w1,0,W-w1,H); } else { drawOne(uploadVideo,0,0,w1,H); drawOne(liveVideo,w1,0,W-w1,H); } }
  }
  if(state.ticker.enabled && state.ticker.text){ ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(0,H-30,W,30); ctx.fillStyle='#fff'; ctx.font='800 18px sans-serif'; ctx.fillText(state.ticker.text,12,H-9); }
}
async function startRecording(){
  if(!state.stream && !state.uploadReady){ showToast('Aktifkan kamera / upload dulu','error'); return; }
  if(state.isRecording){ stopRecording(); return; }
  try{
    showLoader('Menyiapkan rekaman hemat...');
    const isL=isLand();
    const W=isL?REC_W:Math.round(REC_W*9/16), H=isL?Math.round(REC_W*9/16):REC_W;
    recCanvas=document.createElement('canvas'); recCanvas.width=W; recCanvas.height=H; recCtx=recCanvas.getContext('2d',{alpha:false,desynchronized:true});
    state.isRecording=true; lastRecDraw=0; recRAF=requestAnimationFrame(drawComposite);
    // KUNCI: captureStream 24fps + VP8 + 2.5Mbps
    const canvasStream=recCanvas.captureStream(REC_FPS);
    const tracks=[...canvasStream.getVideoTracks()];
    if(state.micEnabled && state.micStream) tracks.push(...state.micStream.getAudioTracks());
    const mime=['video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    state.recordedChunks=[];
    state.mediaRecorder=new MediaRecorder(new MediaStream(tracks),{mimeType:mime||undefined,videoBitsPerSecond:REC_BITRATE});
    state.mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) state.recordedChunks.push(e.data); };
    state.mediaRecorder.onstop=onStop;
    state.mediaRecorder.start(1000); // chunk 1 detik, tidak menumpuk
    btnRecord.classList.add('recording'); recText.textContent='Stop Rekam'; startTimer(); hideLoader(); showToast('● Merekam - Mode Hemat','success');
    [btnStartCam,btnScreen,btnUpload,btnBg,btnSwapScreens].forEach(b=>b.disabled=true);
  }catch(e){ hideLoader(); state.isRecording=false; showToast('Gagal rekam: '+e.message,'error'); }
}
function stopRecording(){ if(!state.isRecording) return; state.isRecording=false; cancelAnimationFrame(recRAF); if(state.mediaRecorder && state.mediaRecorder.state!=='inactive') state.mediaRecorder.stop(); btnRecord.classList.remove('recording'); recText.textContent='Mulai Rekam'; stopTimer(); [btnStartCam,btnScreen,btnUpload,btnBg,btnSwapScreens].forEach(b=>b.disabled=false); showLoader('Menyimpan...'); }
function onStop(){ hideLoader(); const blob=new Blob(state.recordedChunks,{type:state.mediaRecorder.mimeType||'video/webm'}); const url=URL.createObjectURL(blob); previewVideo.src=url; previewInfo.textContent=`Durasi ${recTimerEl.textContent} • ${(blob.size/1024/1024).toFixed(1)} MB • 540p 24fps • Mode Hemat Anti Leg`; previewModal.classList.add('show'); state._blob=blob; state._url=url; }
btnRecord.onclick=startRecording;
btnClosePreview.onclick=()=>{ previewModal.classList.remove('show'); previewVideo.pause(); };
btnDownload.onclick=()=>{ if(!state._blob) return; const a=document.createElement('a'); a.href=state._url; a.download=`recorder-hemat-${Date.now()}.webm`; a.click(); };
btnSaveGallery.onclick=async()=>{ if(!state._blob) return; try{ const f=new File([state._blob],'recorder.webm',{type:state._blob.type}); if(navigator.share && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); showToast('Dibagikan','success'); } else btnDownload.click(); }catch(e){ btnDownload.click(); } };

/* INIT */
applySplit(); updateDivider();
window.addEventListener('resize',()=>{ updateDivider(); if(state.floating.enabled) updateFloat(); });
</script>
</body>
</html>
